version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: clinic-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinic_crm_dev
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: dev_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_user -d clinic_crm_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

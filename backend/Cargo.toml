[package]
name = "clinic-crm-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = { version = "4.4", features = ["rustls"] }
actix-cors = "0.6"
actix-rt = "2.9"
actix-multipart = "0.6"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
deadpool-postgres = "0.12"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
bytes = "1.5"
sha2 = "0.10"
hmac = "0.12"

# Authentication & Security
jsonwebtoken = "9.2"
bcrypt = "0.15"
uuid = { version = "1.6", features = ["v4", "serde"] }
rustls = "0.23"
rustls-pemfile = "2.1"

# Encryption
aes-gcm = "0.10"
rand = "0.8"
argon2 = "0.5"

# Validation
validator = { version = "0.16", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time & Dates
chrono = { version = "0.4", features = ["serde"] }

# Environment & Config
dotenv = "0.15"
config = "0.14"

# Logging & Monitoring
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Rate Limiting
actix-governor = "0.5"

# TLS
openssl = "0.10"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# HIPAA Compliance
secrecy = "0.8"
zeroize = "1.7"

[dev-dependencies]
tokio-test = "0.4"
